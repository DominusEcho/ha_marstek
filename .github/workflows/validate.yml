name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Re-run regularly so upstream rule changes are caught without a push.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Validates custom_components/marstek with Home Assistant's own
      # validation, including the manifest rules for custom integrations.
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # Checks the repository layout, hacs.json and manifest keys HACS needs
      # to install the integration as a custom repository. The license check
      # is skipped: LICENSE.md is Hamedata's own license, not an SPDX one, and
      # it only matters for inclusion in the HACS default store.
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: license

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Keep the aiomarstek pin in requirements_test.txt in step with the
      # requirements in manifest.json.
      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest
